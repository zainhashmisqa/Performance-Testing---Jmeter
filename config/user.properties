# ---------------------------------------------------------------------------
# AZM JMeter Performance Assignment — default properties  (Concept 14)
# ---------------------------------------------------------------------------
# NOTHING in the .jmx is hardcoded. Every value below is read with
#   ${__P(name,fallback)}
# and can be overridden at runtime with -Jname=value, e.g.
#   jmeter -n -t tests/azm_sba_perf.jmx -Jthreads=200 -Jbase_url=...
#
# Load this file with:  -q config/user.properties
# Or an env overlay:    -q config/user.properties -q config/staging.properties
# ---------------------------------------------------------------------------

# --- Environment ------------------------------------------------------------
env=staging

# --- Target application (SBA Academy — sitech-cloud) -------------------------
protocol=https
base_url=sba.sitech-cloud.com
port=443

# --- Endpoint paths (kept as properties so a path change is a flag, not an edit)
path_login=/api/accounts/login/
path_catalog=/api/enrollment/my-courses/
path_certificates=/api/certificates/
path_profile=/api/accounts/me/
path_checkout=/api/certificates/
path_order=/api/enrollment/my-courses/
path_categories=/api/catalog/categories/
# Base path for the catalog. The query string is built in the .jmx from values
# captured upstream (categorySlug, courseSlug), so the search and detail calls
# genuinely depend on earlier responses instead of being fixed URLs.
path_courses_base=/api/catalog/courses/
path_courses=/api/catalog/courses/?category=&type=&language=&difficulty=&duration=&availability=open&search=&page=1

# --- Load profile -----------------------------------------------------------
# Level 1 = 30 VU   Level 2 = 40 VU   Level 3 = 50 VU
# Login is always 1 thread / 1 iteration (single account, no storm on auth).
threads=30
rampup=60
duration=600
loops=-1

# setUp (login) thread group — 1 thread, 1 login, token shared via pool.
login_threads=1
setup_rampup=1

# --- Spike control (Concept 13) ---------------------------------------------
# sync_group_size=1 makes the Synchronizing Timer a NO-OP for normal runs.
# run/spike.ps1 passes -Jsync_group_size=200 to release a true 200-VU burst.
# Never leave this above 1 for baseline/peak or threads will block on each other.
sync_group_size=1
sync_timeout=5000

# --- Correlation (Concept 2) ------------------------------------------------
# The JSON path holding the auth token. Override to simulate the API renaming
# the field and PROVE the self-healing in Concept 17:
#   -Jtoken_json_path=$.sessionToken_renamed
token_json_path=$.token

# --- Test data (Concept 3) --------------------------------------------------
csvfile=data/logins.csv

# --- Think time (Concept 13) ------------------------------------------------
think_constant=2000
think_deviation=1000

# --- Weighted mix (Concept 1) — must total 100 ------------------------------
pct_browse=50
pct_cart=30
pct_checkout=20

# --- Expected assertion values (Concept 12) ---------------------------------
# Override per environment so assertions don't break on a different sandbox.
expected_category=General
expected_currency=SAR
expected_tax_percent=15

# --- Retry (Concept 15) -----------------------------------------------------
max_retries=3
retry_backoff_ms=500
# Set true to deliberately break the checkout call and PROVE retry works.
force_fail=false

# --- JSR223 signature (Concept 6) -------------------------------------------
# Override with -Jhmac_secret=... ; never commit a real secret.
hmac_secret=azm-test-secret-not-a-real-key

# --- Database validation (Concept 11) ---------------------------------------
# Open edX ships MySQL by default; the brief's example was SQL Server.
# Both URL shapes are documented in config/endpoints.md — swap by flag only.
db_pool=azmPool
db_driver=com.mysql.cj.jdbc.Driver
db_url=jdbc:mysql://localhost:3306/edxapp?useSSL=false&allowPublicKeyRetrieval=true
db_user=FILL_ME_IN
db_password=FILL_ME_IN
db_table=student_courseenrollment
db_ref_column=id
db_validate_query=SELECT 1
db_max_connections=10

# Async-safe DB verification. If checkout commits the row asynchronously, an
# immediate query reports a false failure — worst under load, exactly when it
# matters. The query is retried this many times before failing for real.
# Set db_max_tries=1 once you have confirmed the write is synchronous: a
# stricter assertion is a better assertion.
db_max_tries=3
db_retry_delay_ms=400

# --- Monitoring (Concept 8) -------------------------------------------------
influx_url=http://localhost:8086/write?db=jmeter
influx_application=azm_sba
influx_measurement=jmeter
influx_enabled=true

# --- Self-healing (Concept 17) ----------------------------------------------
# Layer 1 (deterministic alias map) is always on.
# Layer 2 (LLM fallback) only runs when this is true AND an endpoint is given.
llm_enabled=false
llm_endpoint=
llm_api_key=

# --- JMeter engine tuning ---------------------------------------------------
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data.on_error=true
jmeter.reportgenerator.overall_granularity=15000

# --- Workload shaping (Concept 13 / deck 10) --------------------------------
# Constant Throughput Timer target, in requests per MINUTE across all threads.
# 0 = disabled (pure think-time model, the default for this brief).
# Set it when you need a fixed arrival rate so a slowdown shows as queueing
# rather than as the offered load quietly dropping.
target_tpm=0

# --- Per-request SLA enforced inside the test (Concept 12 / deck 9) ---------
# Duration Assertion on checkout. A breach FAILS the sample rather than passing
# slowly, so the error rate reflects SLA reality.
sla_checkout_ms=3000

# --- Server-side monitoring (Concept 8 / deck 13) ---------------------------
# Polls the application's own metrics endpoint so bottleneck analysis has CPU,
# memory and queue depth, not just client-side response times.
monitor_threads=1
monitor_interval_ms=5000
path_metrics=/heartbeat/

# --- Test data lifecycle ----------------------------------------------------
# tearDown purges rows this run created. Without it, repeated peak runs grow the
# table until checkout slows for reasons the application is not responsible for.
cleanup_enabled=false
path_cleanup=/internal/orders

# JDBC validation gate: true wherever the driver jar and test DB exist.
# Set false only on a host without the driver, so the run degrades cleanly
# rather than failing every checkout and burying the real results.
jdbc_enabled=false
