# Local / dry-run overlay. Points at a local mock so you can exercise the whole
# script (correlation, chaining, retry, self-heal) with no sandbox access.
#   jmeter -q config/user.properties -q config/local.properties -n -t ...

env=local
protocol=http
base_url=localhost
port=8080

threads=2
rampup=1
duration=60

influx_enabled=false
db_url=jdbc:mysql://localhost:3306/edxapp?useSSL=false&allowPublicKeyRetrieval=true
