# Staging overlay — layer on top of user.properties:
#   jmeter -q config/user.properties -q config/staging.properties -n -t ...
# Only values that DIFFER from the defaults belong here.

env=staging
protocol=https
base_url=sandbox-sba.example-fill-me-in.com
port=443

db_url=jdbc:mysql://STAGING_DB_HOST:3306/edxapp?useSSL=true
db_user=FILL_ME_IN
db_password=FILL_ME_IN

influx_url=http://localhost:8086/write?db=jmeter
influx_enabled=true
