# ===========================================================================
# RMI transport settings for distributed runs (Concept 7 / deck 12).
# MUST be loaded on the controller AND every worker with -q, or the RMI
# handshake fails with: FileNotFoundException rmi_keystore.jks
# ===========================================================================

# --- SSL: disabled for internal/subnet testing (re-enable for cross-network) --
server.rmi.ssl.disable=true

# --- FIXED PORTS: deterministic firewall rules instead of dynamic allocation --
# Default RMI registry port. Workers listen here for controller commands.
server_port=1099
# Fixed local port for RMI data channel. Without this, JMeter picks a random
# ephemeral port per connection and firewalls silently drop the traffic.
server.rmi.localport=1099

# --- RESULT SENDER: stripped mode keeps network overhead minimal --------------
# Workers strip response bodies from successful samples before sending to the
# controller. This is critical at 200+ VUs — full bodies saturate the link.
# Options: Standard, Stripped (default since 2.9), Batch, Statistical, Custom
mode=Stripped

# --- TIMEOUT: prevent zombie workers from blocking the controller -------------
# If a worker doesn't respond within this window, the controller marks it dead
# and continues with the remaining workers rather than hanging indefinitely.
server.rmi.connection.timeout=60000
